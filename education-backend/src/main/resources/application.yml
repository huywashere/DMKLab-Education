server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 1024

spring:
  application:
    name: education-backend
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:learning_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      leak-detection-threshold: 20000
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        reWriteBatchedInserts: true

  jpa:
    hibernate:
      ddl-auto: validate # Tuyệt đối dùng validate hoặc none, schema do Flyway quản lý
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 32 # Tránh N+1
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
        connection:
          provider_disables_autocommit: true
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  cache:
    type: redis
    redis:
      time-to-live: 1800000ms # 30 phút mặc định
      cache-null-values: false
      key-prefix: "cache:"
      use-key-prefix: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: false # Tránh làm sập trạng thái /health khi chạy local chưa bật Redis container

# Cấu hình AI, JWT & Media
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,https://*.dmklab.edu.vn,https://dmklab.edu.vn}
  jwt:
    secret: ${JWT_SECRET:KhanAcademySecureJWTSecretKeyWithHighEntropy2026SuperStrongHMACSHA512KeyDMKLabPlatform}
    expiration-ms: 86400000 # 24h
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
    groq:
      api-key: ${GROQ_API_KEY:}
      model: ${GROQ_MODEL:llama-3.3-70b-versatile}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gemini-2.5-flash}
      base-url: ${OPENAI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      max-tokens-per-request: 1000
      student-daily-quota: 30
  storage:
    provider: ${STORAGE_PROVIDER:r2} # 'r2' (Cloudflare R2 - Không phí Egress) hoặc 'minio' / 's3'
    r2:
      account-id: ${R2_ACCOUNT_ID:}
      bucket: ${R2_BUCKET:education-media}
      access-key: ${R2_ACCESS_KEY_ID:}
      secret-key: ${R2_SECRET_ACCESS_KEY:}
      public-url: ${R2_PUBLIC_URL:https://media.dmklab.edu.vn}
      presigned-expiry-seconds: ${R2_PRESIGNED_EXPIRY:900}
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      bucket: ${S3_BUCKET:education-media}
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin}
      region: ${S3_REGION:us-east-1}
  mail:
    provider: ${EMAIL_PROVIDER:resend} # 'resend' hoặc 'console' (sandbox emulation)
    resend:
      api-key: ${RESEND_API_KEY:}
      from: ${RESEND_FROM:DMKLab Education <onboarding@resend.dev>}
