version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: education_postgres
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=16MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_connections=100
    environment:
      POSTGRES_DB: learning_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learning_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO giả lập S3 Object Storage cho Video & Media theo kiến trúc PDF
  minio:
    image: minio/minio:latest
    container_name: education_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API endpoint
      - "9001:9001" # Web Console
    volumes:
      - minio_data:/data

  # Redis 7 In-Memory Caching & Distributed Rate Limiting & JWT Blacklist
  redis:
    image: redis:7-alpine
    container_name: education_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Spring Boot 3.3.4 (Java 21) Modular Monolith Backend
  backend:
    build:
      context: ./education-backend
      dockerfile: Dockerfile
    container_name: education_backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: learning_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-r2}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-education-media}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-https://media.dmklab.edu.vn}
      S3_ENDPOINT: http://minio:9000
      JWT_SECRET: KhanAcademySecureJWTSecretKeyWithHighEntropy2026SuperStrongHMACSHA512KeyDMKLabPlatform
      OPENAI_API_KEY: ${OPENAI_API_KEY:-mock-key}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-DMKLab Education <onboarding@resend.dev>}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Next.js 16 (App Router + Turbopack) Frontend
  frontend:
    build:
      context: ./education-frontend
      dockerfile: Dockerfile
    container_name: education_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Golang High-Performance Video Transcoder Worker (HLS Adaptive Streaming + FFmpeg)
  video_worker:
    build:
      context: ./video-transcoder-worker
      dockerfile: Dockerfile
    container_name: education_video_worker
    restart: unless-stopped
    environment:
      PORT: 8085
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_QUEUE: queue:video:transcode
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-r2}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-education-media}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-https://media.dmklab.edu.vn}
      S3_ENDPOINT: http://minio:9000
      MAX_CONCURRENT_JOBS: 2
    ports:
      - "8085:8085"
    depends_on:
      redis:
        condition: service_healthy

  # Golang AI Streaming Proxy & Prompt Cache (SSE Multiplexer)
  ai_proxy:
    build:
      context: ./ai-streaming-proxy
      dockerfile: Dockerfile
    container_name: education_ai_proxy
    restart: unless-stopped
    environment:
      PORT: 8086
      OPENAI_API_KEY: ${GEMINI_API_KEY:-${OPENAI_API_KEY:-mock-key}}
      OPENAI_MODEL: ${GEMINI_MODEL:-${OPENAI_MODEL:-gemini-2.5-flash}}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      CACHE_TTL_MINUTES: 1440
      TYPING_CADENCE_MS: 25
    ports:
      - "8086:8086"
    depends_on:
      redis:
        condition: service_healthy

  # Golang Live Gateway & Progress Heartbeat Aggregator (WebSocket Hub)
  live_gateway:
    build:
      context: ./live-gateway
      dockerfile: Dockerfile
    container_name: education_live_gateway
    restart: unless-stopped
    environment:
      PORT: 8087
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      FLUSH_INTERVAL_SECONDS: 60
      MAX_BATCH_SIZE: 500
      BACKEND_SYNC_URL: http://backend:8080/api/v1/internal/progress/batch-sync
    ports:
      - "8087:8087"
    depends_on:
      redis:
        condition: service_healthy

  # Nginx Unified Reverse Proxy & SSL Gateway
  nginx_gateway:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: education_nginx_gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
      - live_gateway
      - ai_proxy

  # Certbot Let's Encrypt SSL Auto-Renew Companion
  certbot:
    image: certbot/certbot:latest
    container_name: education_certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  # Prometheus Real-Time Metrics Scraper & Time-Series DB
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: education_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    depends_on:
      - backend

  # Grafana Centralized Observability Dashboard
  grafana:
    image: grafana/grafana:11.2.0
    container_name: education_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  minio_data:
  redis_data:
  prometheus_data:
  grafana_data:
  certbot_www:
  certbot_conf:
