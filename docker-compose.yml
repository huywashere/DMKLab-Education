version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: education_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: learning_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learning_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO giả lập S3 Object Storage cho Video & Media theo kiến trúc PDF
  minio:
    image: minio/minio:latest
    container_name: education_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API endpoint
      - "9001:9001" # Web Console
    volumes:
      - minio_data:/data

  # Redis 7 In-Memory Caching & Distributed Rate Limiting & JWT Blacklist
  redis:
    image: redis:7-alpine
    container_name: education_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Spring Boot 3.3.4 (Java 21) Modular Monolith Backend
  backend:
    build:
      context: ./education-backend
      dockerfile: Dockerfile
    container_name: education_backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: learning_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      JWT_SECRET: KhanAcademySecureJWTSecretKeyWithHighEntropy2026SuperStrongHMACSHA512KeyDMKLabPlatform
      OPENAI_API_KEY: ${OPENAI_API_KEY:-mock-key}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Next.js 16 (App Router + Turbopack) Frontend
  frontend:
    build:
      context: ./education-frontend
      dockerfile: Dockerfile
    container_name: education_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  redis_data:
